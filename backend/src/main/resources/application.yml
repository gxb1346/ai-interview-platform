server:
  port: 8082

spring:
  application:
    name: ai-interview-platform

  # 启用虚拟线程
  threads:
    virtual:
      enabled: true
  
  # 数据库配置
  datasource:
    url: jdbc:postgresql://localhost:5432/interview_db
    username: postgres
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  # # OpenAI Configuration
  # ai:
  #   openai:
  #     api-key: sk-c31838b0eed74d1d9279fbecd5dc1f5e
  #     base-url: https://dashscope.aliyuncs.com/compatible-mode
  #     chat:
  #       options:
  #         model: qwen-turbo

  # Spring AI配置
  ai:
    openai:
      base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      api-key: ${AI_API_KEY}
      chat:
        options:
          model: ${AI_MODEL:qwen-turbo}
      embedding:
        options:
          model: text-embedding-v3
          dimensions: 1024
  
  # Redis 配置
  data:
    redis:
      host: ::1
      port: 6379
      timeout: 10000ms
      connect-timeout: 10000ms
      lettuce:
        pool:
          enabled: false

  # 使用 Lettuce 客户端（已移除 Redisson 依赖）

  # pgvector配置
  vectorstore:
    pgvector:
      index-type: HNSW
      distance-type: COSINE_DISTANCE
      dimensions: 1024
      initialize-schema: true

# 自定义配置
app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
  jwt:
    secret: RecruitAI-JWT-Secret-Key-2026-Must-Be-At-Least-256-Bits-Long!!
    expiration-ms: 86400000
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin}
    bucket: interview-guide

# 本地 Edge-TTS 语音合成服务（免费替代付费的 DashScope CosyVoice TTS）
# 无需启动 Docker 容器，也可通过 Python 直接运行:
#   cd backend/src/main/python
#   pip install -r edge-tts-requirements.txt
#   python edge-tts-server.py --port 9091
edge-tts:
  base-url: ${EDGE_TTS_BASE_URL:http://localhost:9091}
  voice: ${EDGE_TTS_VOICE:zh-CN-YunxiNeural}

# 本地 faster-whisper ASR 配置（可选，替代付费的 DashScope ASR）
# 启用后需先启动 Python 服务：
#   cd backend/src/main/python
#   pip install -r requirements.txt
#   python whisper_server.py --model base --device cpu --port 9090
whisper:
  enabled: ${WHISPER_ENABLED:false}
  base-url: http://localhost:9090
  model: base
  device: cpu