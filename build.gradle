/*
 * AI Interview Platform - Backend Application
 * Spring Boot 4.0 + Java 21 + Spring AI 2.0 + PostgreSQL + pgvector + RustFS + Redis
 */

plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
}

group = 'com.interview'
version = '0.0.1-SNAPSHOT'

// 源码目录在 backend/ 下（非标准 Gradle 布局）
sourceSets {
    main {
        java {
            srcDirs = ['backend/src/main/java']
        }
        resources {
            srcDirs = ['backend/src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['backend/src/test/java']
        }
        resources {
            srcDirs = ['backend/src/test/resources']
        }
    }
}

repositories {
    maven { url 'https://maven.aliyun.com/repository/public/' }
    maven { url 'https://maven.aliyun.com/repository/spring/' }
    maven { url 'https://maven.aliyun.com/repository/gradle-plugin/' }
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
}

dependencies {
    // Spring Boot Starters (Boot 4.0 modular design)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.apache.commons:commons-pool2'

    // PostgreSQL
    runtimeOnly 'org.postgresql:postgresql'

    // H2 Database for testing
    testRuntimeOnly 'com.h2database:h2'

    // Spring AI 2.0 - OpenAI兼容模式 (阿里云DashScope)
    implementation libs.spring.ai.openai
    // Spring AI 2.0 - PostgreSQL Vector Store (pgvector)
    implementation libs.spring.ai.pgvector
    // Spring AI Agent Utils
    implementation libs.spring.ai.agent.utils

    // Apache Tika for document parsing (PDF, DOCX, TXT)
    implementation libs.tika.core
    implementation libs.tika.parsers

    // AWS S3 SDK for RustFS storage
    implementation libs.aws.s3

    // Pinyin4j - 汉字转拼音
    implementation libs.pinyin4j

    // SpringDoc OpenAPI - Swagger接口文档
    implementation libs.springdoc

    // Dotenv - 自动加载 .env 文件（IDE启动也生效）
    implementation 'io.github.cdimascio:dotenv-java:3.1.0'


    // PDF导出 - iText 8
    implementation libs.itext.core
    implementation libs.itext.font.asian

    // Aliyun DashScope SDK for Qwen3 ASR/TTS (replaces NLS SDK)
    implementation('com.alibaba:dashscope-sdk-java:2.22.7') {
        exclude group: 'org.slf4j', module: 'slf4j-simple' // 使用 Spring Boot 的 Logback
    }

    // Jakarta annotation for Java 21+ (replaces javax.annotation)
    implementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'

    // Lombok
    compileOnly libs.lombok
    annotationProcessor libs.lombok

    // MapStruct - 对象映射 (必须在Lombok之后配置)
    implementation libs.mapstruct
    annotationProcessor libs.mapstruct.processor
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    // Spring Security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // JWT (jjwt 0.12.x)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'


    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// 全局UTF-8编码配置
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}

// 将仓库根目录 .env 注入 bootRun，便于本地加载 AI_BAILIAN_API_KEY 等变量（Gradle 进程默认不读 .env）
// 同时确保 JVM 使用 UTF-8 编码
tasks.named('bootRun') {
    // JVM 编码配置（stdout/stderr：JDK 18+，避免控制台 PrintStream 与 Logback UTF-8 不一致）
    jvmArgs = [
            '-Dfile.encoding=UTF-8',
            '-Dconsole.encoding=UTF-8',
            '-Dstdout.encoding=UTF-8',
            '-Dstderr.encoding=UTF-8'
    ]

    // 加载 .env 文件
    def envFile = rootProject.file('.env')
    if (envFile.exists()) {
        envFile.eachLine { line ->
            def trimmed = line.trim()
            if (trimmed.isEmpty() || trimmed.startsWith('#')) {
                return
            }
            def eq = trimmed.indexOf('=')
            if (eq <= 0) {
                return
            }
            def key = trimmed.substring(0, eq).trim()
            def val = trimmed.substring(eq + 1).trim()
            if ((val.startsWith('"') && val.endsWith('"')) || (val.startsWith("'") && val.endsWith("'"))) {
                val = val.substring(1, val.length() - 1)
            }
            environment key, val
        }
    }
}