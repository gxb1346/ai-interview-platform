# version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: interview_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # 本地 faster-whisper ASR 服务（替代付费的 DashScope ASR）
  whisper:
    build:
      context: ./backend/src/main/python
      dockerfile: Dockerfile
    ports:
      - "9090:9090"
    volumes:
      - whisper_model_data:/root/.cache/huggingface
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
      - HF_HUB_DISABLE_SSL_VERIFY=1
    restart: unless-stopped

  # 本地 Edge-TTS 语音合成服务（免费替代 DashScope CosyVoice TTS）
  edge-tts:
    build:
      context: ./backend/src/main/python
      dockerfile: Dockerfile.tts
    ports:
      - "9091:9091"
    environment:
      - EDGE_TTS_VOICE=zh-CN-YunxiNeural
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  whisper_model_data:
